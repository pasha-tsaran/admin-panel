{% extends "base.html" %}
{% block title %}TOTP — {{ app_name }}{% endblock %}
{% block content %}
<section class="success-card"><h1>Привязка TOTP</h1><div class="warning">Этот QR показывается только сейчас. Не делайте скриншот.</div><img class="totp-qr" src="{{ qr_data_uri }}" alt="QR для приложения-аутентификатора"><details><summary>Не удаётся сканировать</summary><code class="secret-uri">{{ provisioning_uri }}</code></details><form method="post" action="/administrators/{{ administrator_id }}/confirm-totp" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Код из приложения<input name="totp_code" required inputmode="numeric" autocomplete="one-time-code"></label><button class="button" type="submit">Подтвердить TOTP</button></form></section>
{% endblock %}
