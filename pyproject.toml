[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kenai-vpn-admin"
version = "0.1.0"
description = "Modular administration panel for WireGuard and Xray/VLESS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Kenai VPN" }]
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "pyotp>=2.9,<3",
  "qrcode[pil]>=8,<9",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-qrcode>=7.4,<9",
]

[project.scripts]
kenai-admin = "kenai_vpn_admin.cli.main:main"
kenai-vpn-helper = "kenai_vpn_admin.helper.main:main"
kenai-backup = "kenai_vpn_admin.backup.main:main"
kenai-support-worker = "kenai_vpn_admin.infrastructure.telegram_support:main"
kenai-console-maintenance = "kenai_vpn_admin.cli.maintenance:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kenai_vpn_admin"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".venv",
  ".tmp",
  ".test-tmp",
  ".test-temp-awg",
  ".pytest-run",
  ".pytest_cache",
  "pytest-cache-files-*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
packages = ["kenai_vpn_admin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
